<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Kasir Antar Kita</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef5f1;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
      color: #1f2937;
    }

    h1 {
      color: #0f6b4f;
      text-align: center;
    }

    h2 {
      font-size: 18px;
      margin-top: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 4px 0 14px;
      border: 1px solid #cbd5d1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    #tombol-tambah {
      width: 100%;
      padding: 12px;
      background: #0f6b4f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #tombol-tambah:hover {
      background: #0b543e;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: white;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    li button {
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }

    #rekap {
      background: #0f6b4f;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>Kasir Antar Kita</h1>

  <h2>Tambah Transaksi</h2>

    <label for="layanan">Nama layanan</label>
  <input type="text" id="layanan" placeholder="Contoh: Fotokopi A4">

  <label for="jumlah">Jumlah</label>
  <input type="number" id="jumlah" value="1">

  <label for="harga">Harga per unit (Rp)</label>
  <input type="number" id="harga" value="500">

  <button id="tombol-tambah">Tambah</button>
  <h2>Daftar Transaksi</h2>
  <ul id="daftar"></ul>

  <h2>Rekap Hari Ini</h2>
  <p id="rekap"></p>

  <script>
    const daftarTransaksi = JSON.parse(localStorage.getItem("transaksi")) || [];

    function simpanData() {
      localStorage.setItem("transaksi", JSON.stringify(daftarTransaksi));
    }

    function formatRupiah(angka) {
      return "Rp " + angka.toLocaleString("id-ID");
    }

    function tampilkanRekap() {
      const hariIni = new Date().toLocaleDateString("sv-SE");
      let omzet = 0;

      for (const t of daftarTransaksi) {
        if (t.tanggal === hariIni) {
          omzet = omzet + t.total;
        }
      }

      document.getElementById("rekap").textContent = "Omzet hari ini: " + formatRupiah(omzet);
    }

    function tampilkanDaftar() {
      const ul = document.getElementById("daftar");
      ul.innerHTML = "";

      for (let i = 0; i < daftarTransaksi.length; i++) {
        const t = daftarTransaksi[i];
        const li = document.createElement("li");
        li.textContent = t.layanan + " - " + t.jumlah + " x " + formatRupiah(t.harga) + " = " + formatRupiah(t.total) + " ";

        const tombolHapus = document.createElement("button");
        tombolHapus.textContent = "Hapus";
        tombolHapus.addEventListener("click", function () {
          daftarTransaksi.splice(i, 1);
          simpanData();
          tampilkanDaftar();
        });

        li.appendChild(tombolHapus);
        ul.appendChild(li);
      }

      tampilkanRekap();
    }

    document.getElementById("tombol-tambah").addEventListener("click", function () {
      const layanan = document.getElementById("layanan").value;
      const jumlah = Number(document.getElementById("jumlah").value);
      const harga = Number(document.getElementById("harga").value);
      const total = jumlah * harga;

      daftarTransaksi.push({ layanan: layanan, jumlah: jumlah, harga: harga, total: total, tanggal: new Date().toLocaleDateString("sv-SE") });
      simpanData();
      tampilkanDaftar();
    });

    tampilkanDaftar();
  </script>
</body>

</html>
