<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kasir Antar Kita</title>
</head>
<body>
  <body>
  <h1>Kasir Antar Kita</h1>

  <h2>Tambah Transaksi</h2>

  <label for="layanan">Nama layanan</label><br>
  <input type="text" id="layanan" placeholder="Contoh: Fotokopi A4"><br><br>

  <label for="jumlah">Jumlah</label><br>
  <input type="number" id="jumlah" value="1"><br><br>

  <label for="harga">Harga per unit (Rp)</label><br>
  <input type="number" id="harga" value="500"><br><br>

  <button id="tombol-tambah">Tambah</button>

   <ul id="daftar"></ul>
  <script>
    const daftarTransaksi = [];

    function tampilkanDaftar() {
      const ul = document.getElementById("daftar");
      ul.innerHTML = "";

      for (const t of daftarTransaksi) {
        const li = document.createElement("li");
        li.textContent = t.layanan + " - " + t.jumlah + " x Rp " + t.harga + " = Rp " + t.total;
        ul.appendChild(li);
      }
    }

    document.getElementById("tombol-tambah").addEventListener("click", function () {
      const layanan = document.getElementById("layanan").value;
      const jumlah = Number(document.getElementById("jumlah").value);
      const harga = Number(document.getElementById("harga").value);
      const total = jumlah * harga;

      daftarTransaksi.push({ layanan: layanan, jumlah: jumlah, harga: harga, total: total });
      tampilkanDaftar();
    });
  </script>
</body>
</body>
</html>
